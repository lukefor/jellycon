name: Release JellyCon (fork)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository != 'jellyfin/jellycon' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py_version: [ 'py2', 'py3' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Build ${{ matrix.py_version }} addon zip
        run: python build.py --version ${{ matrix.py_version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.py_version }}-release-zip
          path: plugin.video.jellycon+${{ matrix.py_version }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          python -c "import yaml; print(yaml.safe_load(open('release.yaml'))['changelog'])" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "JellyCon $TAG" \
            --notes-file notes.md
